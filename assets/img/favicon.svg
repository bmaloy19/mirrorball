<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- the printed card in miniature: checkerboard frame, pink 60 on cream -->
  <defs>
    <pattern id="ck" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f6c8dd"/>
      <rect width="4" height="4" fill="#e22a8b"/>
      <rect x="4" y="4" width="4" height="4" fill="#e22a8b"/>
    </pattern>
    <clipPath id="round"><rect width="64" height="64" rx="13"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="64" height="64" fill="url(#ck)"/>
    <rect x="8" y="8" width="48" height="48" fill="#fffafc"/>
  </g>
  <text x="32" y="44.5" text-anchor="middle" fill="#e22a8b"
        font-family="Georgia, 'Playfair Display', 'Didot', serif"
        font-weight="bold" font-size="29" letter-spacing="-0.6">60</text>
</svg>
